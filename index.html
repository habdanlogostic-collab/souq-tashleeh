<title>سوق التشليح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: mobile-first marketplace. Sticky brand bar, search-led home, card grid, bottom tab bar, sheet modals. */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#16212B; --muted:#5B6875; --line:#D3DAE0;
  --accent:#C8430C; --accent-soft:#FBE7DC; --accent-ink:#FFFFFF;
  --ok:#1D7449; --ok-soft:#DDF2E6; --warn:#9A6212; --warn-soft:#FBEFD6; --bad:#B8322A; --bad-soft:#FBE1DE;
  --pay:#000000; --pay-ink:#FFFFFF; --shadow:0 1px 2px rgba(22,33,43,.06),0 4px 14px rgba(22,33,43,.06);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161B; --surface:#19222A; --surface-2:#1F2A33; --ink:#E7ECF0; --muted:#93A1AD; --line:#2B3740;
  --accent:#F07038; --accent-soft:#3A2419; --accent-ink:#1A0E08;
  --ok:#4DC48A; --ok-soft:#173226; --warn:#E3B04F; --warn-soft:#352914; --bad:#F06A5E; --bad-soft:#3A1C1A;
  --pay:#FFFFFF; --pay-ink:#000000; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161B; --surface:#19222A; --surface-2:#1F2A33; --ink:#E7ECF0; --muted:#93A1AD; --line:#2B3740;
  --accent:#F07038; --accent-soft:#3A2419; --accent-ink:#1A0E08;
  --ok:#4DC48A; --ok-soft:#173226; --warn:#E3B04F; --warn-soft:#352914; --bad:#F06A5E; --bad-soft:#3A1C1A;
  --pay:#FFFFFF; --pay-ink:#000000; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:700;letter-spacing:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1}
.brand-sub{font-size:11px;color:var(--muted);display:block;margin-top:3px}
.hello{font-size:13px;color:var(--muted);text-align:left}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:6px 16px;text-align:center}

/* panels & fields */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h h2{font-family:var(--f-display);font-size:19px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.field textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.req{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;min-height:42px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;min-height:auto;padding:6px}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.btn.pay{background:var(--pay);color:var(--pay-ink);border-color:var(--pay);font-size:17px;min-height:50px;letter-spacing:.2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.stars{color:#E0A100;letter-spacing:1px;font-size:14px}

/* home */
.hero{background:var(--ink);color:var(--bg);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-display);font-size:clamp(22px,4vw,30px);line-height:1.35;max-width:24ch}
.hero p{margin:0;opacity:.8;font-size:14px;max-width:52ch}
.hero .stripe{position:absolute;inset-inline-start:-40px;bottom:-30px;width:180px;height:60px;transform:rotate(-8deg);background:repeating-linear-gradient(45deg,var(--accent) 0 14px,transparent 14px 28px);opacity:.35;pointer-events:none}
.searchbar{display:flex;gap:8px;position:relative;z-index:1}
.searchbar input{flex:1;min-width:0;border-radius:12px;border:0;padding:12px 14px;min-height:50px;font-size:16px;background:var(--surface);color:var(--ink)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.filters select{border-radius:10px;border:0;padding:8px 10px;min-height:42px;background:var(--surface);color:var(--ink);min-width:0}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}.filters select:last-child{grid-column:1/-1}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.results-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.results-h h2{font-family:var(--f-display);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:start;padding:0;min-width:0}
.card:hover{box-shadow:var(--shadow);border-color:var(--muted)}
.ph{aspect-ratio:4/3;width:100%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);overflow:hidden;position:relative;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ph-cat{position:absolute;bottom:8px;font-size:12px}
.card-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card-t{font-weight:700;font-size:15px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-sub{font-size:12px;color:var(--muted)}
.price{font-weight:700;font-size:17px;color:var(--ink)}
.price small{font-size:12px;color:var(--muted);font-weight:500}
.seller-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px;flex-wrap:wrap}
.empty{text-align:center;padding:32px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{opacity:.5}

/* detail */
.back{align-self:flex-start}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
.gallery{display:flex;flex-direction:column;gap:8px;min-width:0}
.gallery .ph{border-radius:var(--r);border:1px solid var(--line)}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs button{flex:none;width:64px;height:48px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--surface-2)}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:600}
.seller-card{display:flex;flex-direction:column;gap:10px}
.seller-top{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none}
.phone{font-size:18px;font-weight:700;direction:ltr;unicode-bidi:isolate;user-select:all}
.review{border-top:1px solid var(--line);padding-top:8px;font-size:14px}

/* orders */
.order{display:flex;flex-direction:column;gap:10px}
.order-top{display:flex;gap:12px;align-items:flex-start}
.order-top .ph{width:84px;flex:none;border-radius:10px;aspect-ratio:1}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
.steps div{display:flex;flex-direction:column;gap:4px;align-items:center}
.steps i{display:block;height:5px;width:100%;border-radius:3px;background:var(--line)}
.steps .on i{background:var(--ok)}
.steps .on{color:var(--ink);font-weight:600}
.addr{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13px}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;align-self:flex-start;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
.row-img{width:44px;height:34px;border-radius:6px;object-fit:cover;background:var(--surface-2);display:block}
.callout{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.onboard{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.onboard{grid-template-columns:1fr}}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{width:92px;height:72px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--surface-2)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo button{position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.photo-add{width:92px;height:72px;border-radius:10px;border:1.5px dashed var(--muted);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:12px;text-align:center}
.photo-add input{display:none}

/* auth */
.auth{max-width:420px;margin:24px auto 0;width:100%;text-align:center}
.auth h1{font-size:30px}
.auth .field{text-align:start}
.sms{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;text-align:start}
.sms b{font-size:18px;letter-spacing:3px}
.code-in{letter-spacing:10px;text-align:center;font-size:22px!important;direction:ltr}

/* nav */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,20,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.sheet{border-radius:18px}}
.sheet h2{font-family:var(--f-display);font-size:20px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.ap-sheet{text-align:center}
.ap-amount{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.ap-row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.star-pick{display:flex;gap:6px;justify-content:center;direction:ltr}
.star-pick button{font-size:34px;border:0;background:none;cursor:pointer;color:var(--line);padding:0}
.star-pick button.on{color:#E0A100}
.nafath-num{font-size:48px;font-weight:700;font-family:var(--f-display);color:var(--ok);text-align:center}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:0 auto;max-width:420px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;font-weight:600;box-shadow:var(--shadow)}
.spin{width:22px;height:22px;border:3px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.foot{text-align:center;font-size:12px;color:var(--muted);padding-block:8px}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';

/* ---------- reference lists ---------- */
const CITIES = ['الرياض','جدة','مكة المكرمة','المدينة المنورة','الدمام','الخبر','الأحساء','بريدة','عنيزة','الطائف','تبوك','أبها','خميس مشيط','حائل','جازان','نجران','ينبع','الجبيل','الباحة','عرعر','سكاكا','حفر الباطن'];
const MAKES = ['تويوتا','لكزس','هيونداي','كيا','نيسان','هوندا','مازدا','ميتسوبيشي','إيسوزو','فورد','شيفروليه','جي إم سي','كاديلاك','دودج','جيب','كرايسلر','مرسيدس','بي إم دبليو','أودي','فولكس واجن','شانجان','جيلي','إم جي','هافال','أخرى'];
const CATS = ['محركات','قير وناقل حركة','بودي وصاج','أنوار','كهرباء وحساسات','تكييف ورديتر','عفشة ومقصات','فرامل','جنوط وكفرات','داخلية ومقاعد','زجاج ومرايات','أخرى'];
const CONDS = ['ممتازة','جيدة جداً','جيدة','تحتاج صيانة'];
const CARRIERS = ['سمسا','أرامكس','سبل','ناقل','جي آند تي','ريدبوكس','أخرى'];
const SHIP = { same: 30, other: 55 };
const STATUS = [
  ['new','تم الدفع'], ['preparing','قيد التجهيز'], ['shipped','مع شركة الشحن'], ['delivered','تم التوصيل']
];
const STATUS_NAME = Object.fromEntries(STATUS);

/* ---------- state ---------- */
const S = {
  mode: 'loading', isAdmin: false,
  parts: [], sellers: [], orders: [], reviews: [],
  me: null, view: 'loading', params: {},
  f: { q: '', city: '', make: '', cat: '', sort: 'new' },
  login: { step: 'phone', phone: '', code: '', name: '', city: '' },
  checkout: null, form: null, sellTab: 'parts', adminTab: 'sellers',
  imgCache: {}, galleryIdx: 0
};

/* ---------- storage layer (db capability, Cloudflare API, or in-memory fallback for preview) ---------- */
const store = {
  db: null, api: false, mem: {}, subs: {}, polls: {},
  list(c){ return Object.entries(this.mem[c] || {}).map(([id, v]) => ({ id, ...v })); },
  emit(c){ (this.subs[c] || []).forEach(cb => cb(this.list(c))); },
  async req(method, path, body){
    const h = { 'content-type': 'application/json' };
    const t = lsGet('tashleeh.token'), a = lsGet('tashleeh.admin');
    if (t) h.authorization = 'Bearer ' + t;
    if (a) h['x-admin'] = a;
    const r = await fetch('/api' + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(d.error || 'http_' + r.status); e.code = d.error; e.status = r.status; throw e; }
    return d;
  },
  async pull(c){
    const p = this.polls[c]; if (!p) return;
    const h = {};
    const t = lsGet('tashleeh.token'), a = lsGet('tashleeh.admin');
    if (t) h.authorization = 'Bearer ' + t;
    if (a) h['x-admin'] = a;
    if (p.etag) h['if-none-match'] = p.etag;
    try {
      const r = await fetch('/api/c/' + c, { headers: h, cache: 'no-store' });
      if (r.status === 304 || !r.ok) return;
      p.etag = r.headers.get('etag'); p.cb(await r.json());
    } catch (e) {}
  },
  pullAll(reset){ for (const c in this.polls) { if (reset) this.polls[c].etag = null; this.pull(c); } },
  after(c){ this.pull(c); if (c === 'orders') this.pull('parts'); if (c === 'reviews') this.pull('orders'); },
  watch(c, cb){
    if (this.api) {
      this.polls[c] = { cb, etag: null }; this.pull(c);
      if (!this.timer) this.timer = setInterval(() => { if (!document.hidden) this.pullAll(); }, 10000);
      return;
    }
    if (this.db) {
      return this.db.collection(c).onSnapshot(
        s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))),
        () => toast('تعذر تحديث البيانات، أعد فتح الصفحة'));
    }
    (this.subs[c] = this.subs[c] || []).push(cb); cb(this.list(c));
  },
  async get(c, id){
    if (this.api) { try { return await this.req('GET', `/c/${c}/${id}`); } catch (e) { if (e.status === 404) return null; throw e; } }
    if (this.db) { const s = await this.db.collection(c).doc(id).get(); return s.exists ? { id, ...s.data() } : null; }
    const v = (this.mem[c] || {})[id]; return v ? { id, ...JSON.parse(JSON.stringify(v)) } : null;
  },
  async set(c, id, data){
    if (this.api) { await this.req('PUT', `/c/${c}/${id}`, data); return this.after(c); }
    if (this.db) return this.db.collection(c).doc(id).set(data);
    (this.mem[c] = this.mem[c] || {})[id] = JSON.parse(JSON.stringify(data)); this.emit(c);
  },
  async update(c, id, data){
    if (this.api) { await this.req('PATCH', `/c/${c}/${id}`, data); return this.after(c); }
    if (this.db) return this.db.collection(c).doc(id).update(data);
    Object.assign(this.mem[c][id], JSON.parse(JSON.stringify(data))); this.emit(c);
  },
  async del(c, id){
    if (this.api) { await this.req('DELETE', `/c/${c}/${id}`); return this.after(c); }
    if (this.db) return this.db.collection(c).doc(id).delete();
    if (this.mem[c]) delete this.mem[c][id]; this.emit(c);
  }
};
async function safe(fn, msg){
  try { return await fn(); }
  catch (e) {
    const code = e && e.code;
    toast(code === 'quota_exceeded' ? 'امتلأت مساحة التخزين، احذف قطعاً قديمة ثم حاول' :
          code === 'invalid_argument' || code === 'forbidden' ? 'ليست لديك صلاحية لهذا الإجراء' :
          code === 'sold_out' ? 'القطعة نفدت أو لم تعد متوفرة' :
          code === 'duplicate_phone' ? 'هذا الرقم مسجل مسبقاً كبائع' :
          code === 'nafath_required' ? 'وثّق هويتك عبر نفاذ أولاً' :
          code === 'already_rated' ? 'سبق أن قيّمت هذا الطلب' : (msg || 'تعذر الحفظ، حاول مرة أخرى'));
    throw e;
  }
}

function searchParts(){
  const f = S.f;
  const toks = norm(f.q).split(/\s+/).filter(Boolean);
  let list = S.parts.filter(p => {
    const s = sellerById(p.sellerId);
    if (!s || s.status !== 'active' || p.status === 'hidden' || (+p.qty || 0) <= 0) return false;
    if (f.city && p.city !== f.city) return false;
    if (f.make && p.make !== f.make) return false;
    if (f.cat && p.category !== f.cat) return false;
    if (!toks.length) return true;
    const hay = norm([p.title, p.category, p.make, p.model, p.partNo, p.notes, s.name, p.city].join(' '));
    return toks.every(t => {
      const y = +digits(t);
      if (/^\d{4}$/.test(digits(t)) && p.yearFrom && y >= +p.yearFrom && y <= +(p.yearTo || p.yearFrom)) return true;
      return hay.includes(t);
    });
  });
  if (f.sort === 'cheap') list.sort((a, b) => a.price - b.price);
  else if (f.sort === 'rating') list.sort((a, b) => ratingOf(b.sellerId).avg - ratingOf(a.sellerId).avg);
  else list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return list;
}

function orderSteps(o){
  const i = STATUS.findIndex(s => s[0] === o.status);
  return `<div class="steps">${STATUS.map((s, k) => `<div class="${k <= i ? 'on' : ''}"><i></i>${s[1]}</div>`).join('')}</div>`;
}
function addrHtml(d){
  if (!d) return '';

    ${esc(d.name)} · <span dir="ltr" class="num">${esc(d.phone)}</span><br>${esc([d.city, d.district, d.details].filter(Boolean).join('، '))}</div>`;
}

}

function sellView(){
  const acting = S.params.sellerId && S.isAdmin;
  if (!acting && !S.me) return `<div class="empty panel"><b>سجّل دخولك لبيع القطع</b><button class="btn primary" data-action="to-login">تسجيل الدخول</button></div>`;
  const s = acting ? sellerById(S.params.sellerId) : mySeller();
  if (!s) {
    const verified = S.me && S.me.nafath && S.me.nafath.verified;
    return `<h2 class="display" style="font-size:22px">بيع قطع في سوق التشليح</h2>
    <div class="onboard">
      <section class="panel"><h2 class="display" style="font-size:18px">🏭 صاحب تشليح؟</h2>
        <p style="margin:0">تعاقد معنا وحط كل القطع اللي في مستودعك. يوصلك الطلب مدفوع، وشركة الشحن تستلم القطعة من عندك.</p>
        <button class="btn primary" data-action="join-merchant">اطلب التعاقد كتاجر</button></section>
      <section class="panel"><h2 class="display" style="font-size:18px">👤 عندك قطعة وحدة تبيعها؟</h2>
        <p style="margin:0">تقدر تبيع كفرد بشرط توثيق هويتك عن طريق نفاذ، عشان المصداقية وحماية المشتري.</p>
        <button class="btn primary" data-action="${verified ? 'individual-setup' : 'nafath'}">${verified ? 'أكمل بيانات البائع' : 'التحقق عبر نفاذ'}</button>
        ${verified ? '<span class="badge b-ok">✓ هويتك موثقة بنفاذ</span>' : ''}</section>
    </div>`;
  }
  if (s.status === 'pending') return `<section class="panel"><h2 class="display" style="font-size:20px">طلبك قيد المراجعة</h2><p style="margin:0">استلمنا طلب تعاقد «${esc(s.name)}». بنتواصل معك على <span dir="ltr">${esc(s.phone)}</span> لتوقيع العقد، وبعدها تقدر تضيف قطعك.</p></section>`;
  if (s.status === 'suspended' && !acting) return `<section class="panel"><h2 class="display" style="font-size:20px">الحساب موقوف مؤقتاً</h2><p style="margin:0">تواصل مع إدارة سوق التشليح لإعادة التفعيل.</p></section>`;
  const parts = S.parts.filter(p => p.sellerId === s.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const orders = S.orders.filter(o => o.sellerId === s.id).sort((a, b) => b.createdAt - a.createdAt);
  const r = ratingOf(s.id);
  const sales = orders.reduce((a, o) => a + (+o.price || 0), 0);
  const newO = orders.filter(o => o.status === 'new').length;
  return `${acting ? `<div class="callout">أنت (الإدارة) تدير قطع التاجر: <b>${esc(s.name)}</b>. <button class="btn sm" data-action="nav" data-view="admin">رجوع للإدارة</button></div>` : ''}
  <div class="panel-h"><div><h2 class="display" style="font-size:22px">${esc(s.name)}</h2><div class="btns" style="margin-top:4px">${sellerBadge(s)} <span class="badge">${esc(s.city || '')}</span> ${starsHtml(r.avg, r.count)}</div></div>
    <button class="btn primary" data-action="new-part" data-seller="${esc(s.id)}">+ إضافة قطعة</button></div>
  <div class="stats">
    <div class="stat"><b>${parts.length}</b><span>قطعة في المستودع</span></div>
    <div class="stat"><b>${newO}</b><span>طلب جديد بانتظار التجهيز</span></div>
    <div class="stat"><b>${orders.length}</b><span>إجمالي الطلبات</span></div>
    <div class="stat"><b style="font-size:19px">${money(sales)}</b><span>قيمة المبيعات</span></div>
  </div>
  <div class="tabs"><button data-action="sell-tab" data-tab="parts" aria-pressed="${S.sellTab === 'parts'}">القطع (${parts.length})</button><button data-action="sell-tab" data-tab="orders" aria-pressed="${S.sellTab === 'orders'}">الطلبات (${orders.length})</button></div>
  ${S.sellTab === 'parts' ? (parts.length ? `<div class="table-wrap"><table><thead><tr><th></th><th>القطعة</th><th>السيارة</th><th>الحالة</th><th>السعر</th><th>الكمية</th><th></th></tr></thead><tbody>
    ${parts.map(p => `<tr><td>${p.thumbs && p.thumbs[0] ? `<img class="row-img" src="${esc(p.thumbs[0])}" alt="">` : `<span class="row-img"></span>`}</td>
      <td><b>${esc(p.title)}</b><div class="small muted">${esc(p.category)}</div></td>
      <td>${esc([p.make, p.model, p.yearFrom].filter(Boolean).join(' '))}</td><td>${esc(p.condition)}</td>
      <td class="num">${money(p.price)}</td><td class="num">${(+p.qty || 0) > 0 ? esc(p.qty) : '<span class="badge b-bad">نفدت</span>'}</td>
      <td><div class="btns"><button class="btn sm" data-action="edit-part" data-id="${esc(p.id)}">تعديل</button><button class="btn sm danger" data-action="del-part" data-id="${esc(p.id)}">حذف</button></div></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty panel">${ICON.store}<b>المستودع فاضي</b><span class="small">أضف أول قطعة باسمها وصورها وسعرها، وبتظهر مباشرة في البحث.</span><button class="btn primary" data-action="new-part" data-seller="${esc(s.id)}">+ إضافة قطعة</button></div>`)
  : (orders.length ? orders.map(o => sellerOrderCard(o)).join('') : `<div class="empty panel">${ICON.box}<b>لا توجد طلبات بعد</b></div>`)}`;
}
function sellerOrderCard(o){

    <div class="panel-h"><b>${esc(o.partTitle)}</b><span class="badge ${o.status === 'new' ? 'b-acc' : o.status === 'delivered' ? 'b-ok' : 'b-warn'}">${esc(STATUS_NAME[o.status])}</span></div>
    <div class="small muted num">طلب #${esc(o.id.slice(-6).toUpperCase())} · ${fmtDate(o.createdAt)} · سعر القطعة ${money(o.price)} · مدفوع عبر Apple Pay</div>

    ${next ? `<button class="btn primary" data-action="advance" data-id="${esc(o.id)}">${next[0] === 'preparing' ? 'بدء تجهيز القطعة' : next[0] === 'shipped' ? 'تسليم لشركة الشحن' : 'تأكيد التوصيل'}</button>` : ''}

  : (S.orders.length ? `<div class="table-wrap"><table><thead><tr><th>رقم</th><th>التاريخ</th><th>القطعة</th><th>التاجر</th><th>المشتري</th><th>التوصيل</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody>

/* ---------- image processing ---------- */
function loadImg(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); });
}
function toJpeg(img, max, q){
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function processFile(f){
  const img = await loadImg(f);
  let max = 1100, q = .75, full = toJpeg(img, max, q);
  while (full.length > 220000 && max > 400) { max -= 150; q = Math.max(.5, q - .05); full = toJpeg(img, max, q); }
  return { full, thumb: toJpeg(img, 300, .62) };
}

  if (!admin && needLogin('sell')) return;
  openModal(`${sheetHead(admin ? 'إضافة تاجر متعاقد' : 'طلب التعاقد كتاجر')}
    <label class="field"><span>اسم التشليح <span class="req">*</span></span><input id="m-name" placeholder="مثال: تشليح الصناعية الجديدة"></label>
    ${admin ? `<label class="field"><span>جوال التاجر <span class="req">*</span> (يدخل به التاجر للتطبيق)</span><input id="m-phone" inputmode="numeric" dir="ltr" placeholder="05XXXXXXXX"></label>` : `<div class="small muted">الجوال المسجل: <span dir="ltr">${esc(S.me.phone)}</span></div>`}
    <div class="grid2"><label class="field"><span>المدينة <span class="req">*</span></span><select id="m-city">${opts(CITIES, admin ? '' : S.me.city, 'اختر')}</select></label>
    <label class="field"><span>الحي أو المنطقة الصناعية</span><input id="m-dist"></label></div>
    <label class="field"><span>رابط الموقع في خرائط قوقل</span><input id="m-map" dir="ltr" placeholder="https://maps.app.goo.gl/..."></label>
    <div class="grid2"><label class="field"><span>رقم السجل التجاري</span><input id="m-cr" inputmode="numeric" dir="ltr"></label>
    ${admin ? `<label class="field"><span>رقم العقد</span><input id="m-contract" dir="ltr"></label>` : ''}</div>
    <button class="btn primary block" data-action="save-merchant" data-admin="${admin ? 1 : 0}">${admin ? 'إضافة التاجر' : 'إرسال الطلب'}</button>`);
}
function finishLogin(acc){
  S.me = { ...acc, phone: acc.phone || acc.id }; lsSet('tashleeh.phone', S.me.phone);
  toast('أهلاً ' + (S.me.name || ''));
  const a = S.after; S.after = null;
  if (a && a.view === 'checkout') { A.buy({ dataset: { id: a.params.id } }); return; }
  go(a ? a.view : 'home', a ? a.params : {});
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = A[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A') return;
  fn(el, e);
});
function bind(e){
  const b = e.target.dataset && e.target.dataset.bind; if (!b) return;
  const path = b.split('.'); let o = S; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length - 1]] = e.target.value;
  if (path[0] === 'f') updateResults();
  if (b === 'checkout.city') { const p = partById(S.params.id); const sm = $('#summary'); if (p && sm) sm.innerHTML = summaryHtml(p, S.checkout.city ? (S.checkout.city === p.city ? SHIP.same : SHIP.other) : null); }
}
document.addEventListener('input', bind);
document.addEventListener('change', async e => {
  bind(e);
  if (e.target.id === 'pf-file') {
    const files = [...e.target.files].slice(0, 4 - S.form.imgs.length); if (!files.length) return;
    S.form.busy = true; $('#photos').innerHTML = photosHtml();
    for (const f of files) { try { S.form.imgs.push(await processFile(f)); } catch (err) { toast('تعذر قراءة إحدى الصور'); } }
    S.form.busy = false; if ($('#photos')) $('#photos').innerHTML = photosHtml();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.id === 'login-phone') A['send-code']();
  if (e.key === 'Enter' && e.target.id === 'login-code') A['verify-code']();
});

/* ---------- boot ---------- */
(async function init(){
  render();
  let db = null, user = null;
  try {
    if (window.claude && window.claude.use) [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  } catch (e) {}
  if (!db) { try { const r = await fetch('/api/health', { cache: 'no-store' }); store.api = r.ok && !!(await r.json()).ok; } catch (e) {} }
  store.db = db; S.mode = db || store.api ? 'live' : 'memory';
  if (user) { try { S.isAdmin = !!(await user.isOwner()); } catch (e) {} }
  let saved = lsGet('tashleeh.phone');
  if (store.api) {
    let who = {};
    try { who = await store.req('GET', '/auth/me'); } catch (e) {}
    if (!who.phone) { lsSet('tashleeh.token', null); saved = null; } else saved = who.phone;
    if (!who.admin) lsSet('tashleeh.admin', null);
    S.isAdmin = !!who.admin;
  } else if (!db) S.isAdmin = true;
  ['parts','sellers','orders','reviews'].forEach(c => store.watch(c, list => { S[c] = list; refresh(); }));
  if (saved) { try { const a = await store.get('accounts', saved); if (a) S.me = { ...a, phone: saved }; } catch (e) {} }
  S.view = S.me ? 'home' : 'login';
  render();
})();
</script>
